server:
  port: 8080
  servlet:
    context-path: /api

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/gescom_db
    username: postgres
    password: 123456
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    defer-datasource-initialization: true
    properties:
      hibernate:
        format_sql: true

  sql:
    init:
      mode: never

  jackson:
    mapper:
      accept-case-insensitive-enums: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

logging:
  level:
    root: INFO
    com.GesCom: DEBUG

# Configuración de la aplicación
application:
  name: GesCom
  storage:
    uploads-dir: ./uploads
  security:
    jwt:
      secret-key: dGhpcy1pcy1hLXZlcnktc2VjdXJlLWtleS1mb3Itand0
      expiration: 86400000
  super-admin:
    email: ${SUPER_ADMIN_EMAIL:gescomservicetechnologycompany@gmail.com}
